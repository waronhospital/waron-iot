services:
  waron-iot:
    build: .
    image: waron-iot:local
    init: true
    restart: unless-stopped
    ports:
      - "${WARON_PORT:-8000}:8000"
    environment:
      TZ: Asia/Jakarta
      NETPULSE_READ_TOKEN: "${NETPULSE_READ_TOKEN:-}"
      NETPULSE_CORS_ORIGINS: "${NETPULSE_CORS_ORIGINS:-}"
    volumes:
      - device-config:/app/config
      - telemetry:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  telemetry:
  device-config:
